; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stick-c]
platform = espressif32@6.1.0
board = m5stick-c
framework = arduino

board_build.partitions = huge_app.csv
; deep+ evaluates preprocessor conditionals (__has_include / #ifdef WORKER_URL
; in app_balance.cpp) so framework libs like Preferences resolve in both the
; mock and live build modes.
lib_ldf_mode = deep+
build_flags = 
	-DCORE_DEBUG_LEVEL=0
    
lib_deps =
	kosme/arduinoFFT @ 1.6.1
	z3t0/IRremote @ 4.2.0
	bblanchon/ArduinoJson @ ^6.21.4
	; upstream pinned m5stack/M5GFX @ 0.1.11, which the PlatformIO registry
	; no longer serves (0.2.x only as of 2026). Same version, from the tag:
	https://github.com/m5stack/M5GFX/archive/refs/tags/0.1.11.tar.gz
	
