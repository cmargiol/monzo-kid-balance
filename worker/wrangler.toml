name = "monzo-kid-balance"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Create the namespace once with:  npx wrangler kv namespace create KV
# then paste the id it prints below. `wrangler dev` ignores the id and uses
# a local simulated store.
kv_namespaces = [
  { binding = "KV", id = "ebd139a903784c4b9300fd7b815e6386" },
]

# Refresh cadence; the webhook (next PR) makes updates near-instant, this is
# the backstop. Also the only writer allowed to refresh OAuth tokens.
[triggers]
crons = ["*/15 * * * *"]

# Secrets (set with `npx wrangler secret put <NAME>`, never in this file):
#   DEVICE_TOKEN        — bearer token the gadget sends (openssl rand -base64 32)
#   ADMIN_TOKEN         — ?admin= token for the setup/health routes (same recipe)
#   MONZO_CLIENT_ID     — from developers.monzo.com (Confidential client)
#   MONZO_CLIENT_SECRET — from developers.monzo.com
#   ACCOUNT_ID          — the child account's acc_… id (from /admin/accounts).
#                         A secret rather than a var to keep identifiers out of
#                         this public repo.
#   WEBHOOK_KEY         — shared secret in the webhook URL (Monzo webhooks are
#                         unsigned); openssl rand -hex 24
#   NTFY_TOPIC          — optional: ntfy.sh topic for "needs re-approval" nags.
#                         Pick something unguessable (openssl rand -hex 8) and
#                         subscribe to it in the ntfy phone app.
